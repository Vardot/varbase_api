services:
  varbase_api.oauth_key:
    class: '\Drupal\varbase_api\OAuthKey'
    arguments: ["@config.factory", "@file_system"]
  varbase_api.request_subscriber:
    class: '\Drupal\varbase_api\EventSubscriber\VarbaseApiRequestSubscriber'
    arguments:
      [
        "@current_route_match",
        "@varbase_api.oauth_key",
        "@string_translation",
        "@messenger"
      ]
    tags:
      - { name: event_subscriber }
  Drupal\varbase_api\Hook\VarbaseApiHooks:
    class: Drupal\varbase_api\Hook\VarbaseApiHooks
    arguments:
      - '@config.factory'
      - '@router.builder'
      - '@router.route_provider'
      - '@config.installer'
      - '@current_user'
      - '@jsonapi.resource_type.repository'
      - '@entity_type.manager'
      - '@logger.factory'
