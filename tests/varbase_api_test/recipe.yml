name: 'Varbase API Test'
description: 'Provisions a site for the Varbase API automated tests: enables Varbase API (which pulls in JSON:API, OpenAPI and Simple OAuth and relocates the JSON:API base path to /api) and grants the administration permission to the Content editor role.'
type: 'Testing'
install:
  - varbase_api
config:
  actions:
    user.role.content_editor:
      grantPermissions:
        - 'administer varbase api settings'
