name: 'Varbase API Test Roles'
description: 'Creates the site_admin user role that the Varbase API default recipe grants permissions to. On a full Varbase site this role is provided by the Varbase profile; the Varbase API automated tests run on the Drupal Standard profile, so this helper recipe creates the role entity up front. Applied as a dependency recipe before Varbase API installs. The role config lives in this recipe config/ directory and is created when the recipe is applied.'
type: 'Testing'
